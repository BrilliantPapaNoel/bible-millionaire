<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bible Millionaire — Version 7 TV Display</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#234b9c,#061332 72%);color:white;font-family:system-ui;min-height:100vh}header{text-align:center;color:#ffdc74;font-weight:900;font-size:clamp(18px,3vw,38px);padding:22px;border-bottom:2px solid #a17b35}#pair{max-width:560px;margin:8vh auto;text-align:center;background:#132c61;padding:30px;border:2px solid #d6a748;border-radius:20px}input,button{font:inherit;padding:13px;border-radius:10px}input{width:190px;text-transform:uppercase}button{background:#f8d46d;color:#122246;font-weight:900;cursor:pointer}main{display:none;grid-template-columns:minmax(0,1fr) 190px;gap:20px;padding:25px}.stage{text-align:center}.card{border:3px solid #dba83e;border-radius:24px;padding:30px;background:#102e68}.pill{color:#ffe087;font-weight:900}#q{font-size:clamp(27px,4vw,56px);font-weight:900;margin:30px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px}.answer{background:#17488e;border:2px solid #668dd2;padding:18px;text-align:left;border-radius:14px;font-size:clamp(17px,2.2vw,30px);font-weight:750}.answer b{color:#ffdd75}.answer.chosen{background:#7c5b20;border-color:#ffe087}.answer.correct{background:#17653f;border-color:#64edb0}.answer.wrong{background:#792b43;border-color:#ff6b80}.answer.gone{visibility:hidden}.ladder{display:flex;flex-direction:column-reverse;gap:5px}.step{background:#0a204c;padding:8px;border-radius:6px}.step.current{background:#ffd56a;color:#16234c;font-weight:900}.step.safe{border:1px solid #b28d45}#message{font-size:clamp(18px,2vw,27px);margin:18px 0;color:#ffe087;font-weight:800}#poll{text-align:left;max-width:700px;margin:auto}.bar{height:13px;background:#07152f;border-radius:10px;overflow:hidden}.fill{height:100%;background:#ffcc5b}@media(max-width:850px){main{grid-template-columns:1fr}.ladder{display:none}.card{padding:16px}.answers{gap:8px}.answer{padding:10px}}

html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column}header{flex:0 0 auto;padding:clamp(6px,1.4vh,18px)}main{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) minmax(130px,17vw);padding:clamp(8px,1.6vw,24px);gap:clamp(8px,1.3vw,20px);align-items:stretch}.stage,.card{min-height:0}.card{height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(12px,2vw,28px)}#q{font-size:clamp(22px,3.4vw,52px);margin:clamp(8px,2vh,25px) 0}.answer{font-size:clamp(17px,2vw,28px);padding:clamp(9px,1.4vw,18px)}.ladder{gap:3px}.step{padding:clamp(3px,.65vh,8px);font-size:clamp(10px,1.25vw,18px)}#message{margin:8px 0}#timer{font-size:clamp(24px,3.4vw,48px);font-weight:1000;color:#ffdf79;font-variant-numeric:tabular-nums}#timer.urgent{color:#ff637e;animation:pulse .55s infinite alternate}@keyframes pulse{to{transform:scale(1.08);opacity:.7}}.answer.correct.flash{animation:winflash .48s 5 alternate}@keyframes winflash{to{background:#2ce39d;color:#051b28;box-shadow:0 0 38px #43ffbd}}.answer.wrong.flash{animation:shake .2s 4}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}#celebration{position:fixed;inset:0;z-index:10;pointer-events:none;display:none;align-items:center;justify-content:center;text-align:center;background:#06142bbb;font-size:clamp(40px,7vw,105px);font-weight:1000;color:#ffe08a;text-shadow:0 0 35px #ffd76b;animation:celebrate 1.6s ease-out forwards}#celebration.visible{display:flex}@keyframes celebrate{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.12)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}#controls{display:flex;justify-content:center;align-items:center;gap:8px;padding:4px;background:#071632}#controls button{font-size:12px;padding:7px 10px}#audioNotice{font-size:12px;color:#d6e2fa}#pair{margin:auto}#poll{max-height:20vh;overflow:hidden}body.tv-full header{padding:6px}body.tv-full #controls{opacity:.08}body.tv-full #controls:focus-within,body.tv-full #controls:hover{opacity:1}
@media(max-width:850px){main{grid-template-columns:minmax(0,1fr) minmax(100px,19vw)}.ladder{display:flex}.card{padding:10px}.answer{padding:8px}.answers{gap:6px}}
@media(max-height:620px){header{font-size:20px;padding:4px}.card{padding:8px}#q{font-size:clamp(18px,3vw,34px);margin:5px 0}.answer{font-size:clamp(14px,1.6vw,23px);padding:7px}.step{padding:2px 5px}#message{font-size:16px;margin:4px}}
</style></head><body><header>✦ WHO WANTS TO BE A BIBLE MILLIONAIRE? ✦</header><section id="pair"><h2>Connect to your iPhone host</h2><p>Enter the six-character code shown on the iPhone.</p><input id="code" maxlength="6" autocomplete="off" placeholder="ABC123"><button id="connect">Connect</button><p id="status">Keep both devices connected to the internet.</p></section><div id="controls"><button id="soundBtn" type="button">🔊 Enable sound</button><button id="fullBtn" type="button">⛶ Full screen</button><span id="audioNotice">Tap Enable sound once on this iPad</span></div><main id="screen"><section class="stage"><div class="card"><div class="pill" id="meta">WAITING FOR HOST</div><div id="timer" aria-live="off">00:30</div><div id="q">Get ready to play!</div><div class="answers" id="answers"></div><div id="message"></div><div id="poll"></div></div></section><aside><h3 style="color:#ffdb78">PRIZE LADDER</h3><div class="ladder" id="ladder"></div></aside></main><script>
const $=id=>document.getElementById(id);let peer,connection;
$('connect').onclick=()=>{const code=$('code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){$('status').textContent='Please enter the 6-character code.';return}if(typeof Peer==='undefined'){$('status').textContent='Connection service unavailable. Check internet access.';return}$('status').textContent='Connecting…';$('connect').disabled=true;peer=new Peer();peer.on('open',()=>{connection=peer.connect('biblemillionaire7-'+code,{reliable:true});connection.on('open',()=>{$('pair').style.display='none';$('screen').style.display='grid';connection.send({type:'TV_READY'})});connection.on('data',d=>{if(d&&d.type==='STATE')render(d.state)});connection.on('close',()=>{$('pair').style.display='block';$('screen').style.display='none';$('status').textContent='Disconnected. Refresh both pages to reconnect.';$('connect').disabled=false});connection.on('error',()=>{$('status').textContent='Unable to connect. Check the code.';$('connect').disabled=false})});peer.on('error',e=>{$('status').textContent='Connection error: '+e.type;$('connect').disabled=false})};
function render(s){$('meta').textContent=s.gameName+' • QUESTION '+s.q+' / '+s.total+' • $'+s.prize.toLocaleString();$('q').textContent=s.question;$('answers').replaceChildren();s.options.forEach((opt,i)=>{let el=document.createElement('div');el.className='answer';if(s.hidden.includes(i))el.classList.add('gone');if(!s.revealed&&s.selected===i)el.classList.add('chosen');if(s.revealed&&s.correct===i)el.classList.add('correct');if(s.revealed&&s.selected===i&&s.correct!==i)el.classList.add('wrong');let b=document.createElement('b');b.textContent='ABCD'[i]+'. ';el.append(b,document.createTextNode(opt));$('answers').append(el)});$('message').textContent=s.message+(s.revealed?' '+s.explanation:'');$('ladder').replaceChildren();s.ladder.forEach(item=>{let el=document.createElement('div');el.className='step'+(item.current?' current':'')+(item.safe?' safe':'');el.textContent='$'+item.prize.toLocaleString();$('ladder').append(el)});$('poll').replaceChildren();if(s.audience){let title=document.createElement('h2');title.textContent='ASK THE AUDIENCE';$('poll').append(title);s.audience.forEach((pct,i)=>{let wrap=document.createElement('div');wrap.style.margin='8px 0';let label=document.createElement('div');label.textContent='ABCD'[i]+' — '+pct+'%';let bar=document.createElement('div');bar.className='bar';let fill=document.createElement('div');fill.className='fill';fill.style.width=pct+'%';bar.append(fill);wrap.append(label,bar);$('poll').append(wrap)})}}

let audioCtx=null,soundOn=false,previousEventSerial=-1,previousQuestion='',latestState=null,previousExpired=false;
function enableAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();soundOn=true;$('soundBtn').textContent='🔊 Sound on';$('audioNotice').textContent='Original game-show sounds enabled'}catch(e){$('audioNotice').textContent='Audio not supported on this device'}}
$('soundBtn').onclick=()=>{if(soundOn){soundOn=false;$('soundBtn').textContent='🔇 Sound off'}else enableAudio()};
$('fullBtn').onclick=async()=>{document.body.classList.add('tv-full');try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else $('audioNotice').textContent='For a larger iPad display, use Safari’s Hide Toolbar or Add to Home Screen.'}catch(e){$('audioNotice').textContent='iPad Safari may not support true fullscreen. Use Hide Toolbar or Add to Home Screen.'}};
function note(freq,start,duration,kind='sine',volume=.09){if(!soundOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=kind;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g).connect(audioCtx.destination);o.start(start);o.stop(start+duration+.03)}
function music(type){if(!soundOn||!audioCtx)return;let now=audioCtx.currentTime+.02;const sequences={intro:[[392,0,.22],[523,.25,.22],[659,.5,.24],[784,.76,.5]],select:[[440,0,.14],[554,.18,.18]],correct:[[523,0,.19],[659,.21,.19],[784,.42,.23],[1046,.68,.65]],wrong:[[392,0,.26],[330,.29,.27],[261,.6,.7]],millionaire:[[523,0,.2],[659,.22,.2],[784,.44,.2],[1046,.67,.25],[1318,.95,.7]],finished:[[330,0,.24],[262,.28,.5]],timeout:[[659,0,.16],[659,.25,.16],[392,.5,.55]]};(sequences[type]||[]).forEach(([f,at,d])=>note(f,now+at,d,type==='wrong'?'triangle':'sine'))}
function celebrate(type){const el=document.createElement('div');el.id='celebration';el.className='visible';el.textContent=type==='millionaire'?'🏆 MILLIONAIRE! 🏆':type==='correct'?'✨ CORRECT! ✨':type==='finished'?'🏅 WELL PLAYED! 🏅':'TRY AGAIN!';document.getElementById('celebration')?.remove();document.body.append(el);setTimeout(()=>el.remove(),1800);const cls=type==='correct'||type==='millionaire'?'correct':'wrong';document.querySelectorAll('.answer.'+cls).forEach(a=>{a.classList.remove('flash');void a.offsetWidth;a.classList.add('flash')})}
function updateTimer(){if(!latestState||!latestState.timer)return;const tm=latestState.timer;let seconds=tm.running?Math.max(0,Math.ceil((tm.deadline-Date.now())/1000)):tm.remaining;const label=seconds===0&&tm.remaining===0&&!tm.expired&&!tm.running?'00:00':('0'+Math.floor(seconds/60)).slice(-2)+':'+('0'+seconds%60).slice(-2);$('timer').textContent=label;$('timer').classList.toggle('urgent',seconds<=10&&seconds>0&&tm.running);if(seconds===0&&tm.running&&!previousExpired){previousExpired=true;music('timeout')}if(seconds>0)previousExpired=false}
setInterval(updateTimer,200);
const oldRender=render;
render=function(s){const questionChanged=previousQuestion!==s.gameName+'-'+s.q;previousQuestion=s.gameName+'-'+s.q;oldRender(s);latestState=s;updateTimer();if(questionChanged&&previousEventSerial!==-1)music('intro');if(s.eventSerial!==previousEventSerial){if(previousEventSerial!==-1&&s.event){music(s.event);celebrate(s.event)}previousEventSerial=s.eventSerial}};
</script></body></html>
